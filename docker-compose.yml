
services:
  mongodb:
    image: mongo:8.0
    container_name: movie_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: movie_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy

  report-service:
    build: ./report-service
    container_name: movie_report_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  mongodb_data:
